<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrenchDesk v3</title>
<style>
:root{
  --ink:#16202e; --panel:#1f2b3b; --line:#2e3d52; --text:#e6ebf2; --sub:#9aa8ba;
  --long:#3fb68b; --short:#e5645c; --wait:#e0b04a; --blue:#6ea8fe;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:15px;line-height:1.6}
.num{font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:17px;margin:4px 0 10px;font-weight:700;letter-spacing:.02em}
h1 small{color:var(--sub);font-weight:400;font-size:13px;margin-left:6px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--panel);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{color:var(--sub);font-size:12.5px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;font-size:13.5px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.warn{border-color:#6b3a3a;color:#f3b3ad}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:4px 0 12px}
.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--sub);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--text)}
.card{background:var(--panel);border-radius:10px;padding:10px 12px;margin-bottom:10px;border-left:4px solid var(--line)}
.card.L{border-left-color:var(--long)} .card.S{border-left-color:var(--short)} .card.W{border-left-color:var(--wait)}
.card h3{margin:0 0 6px;font-size:15.5px;display:flex;justify-content:space-between;gap:8px}
.card h3 em{font-style:normal;font-size:13px;color:var(--sub);font-weight:400}
ol.six{margin:0;padding-left:1.4em;font-size:13.5px}
ol.six li{margin:2px 0}
ol.six li span{color:var(--sub)}
.L-t{color:var(--long)} .S-t{color:var(--short)} .W-t{color:var(--wait)} .sub{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
.scroll{overflow-x:auto}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:400}
tr.live td{background:rgba(110,168,254,.08)}
.log div{font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
.log i{font-style:normal;color:var(--sub);margin-right:6px}
details{background:var(--panel);border-radius:10px;padding:8px 12px;margin-bottom:10px}
summary{cursor:pointer;color:var(--sub)}
label{display:block;font-size:13px;color:var(--sub);margin-top:8px}
input{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.err{background:#3a2226;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.empty{color:var(--sub);padding:18px 4px;font-size:14px}
dl.rules{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0}
dl.rules dt{color:var(--sub)} dl.rules dd{margin:0}
@media (min-width:640px){ .top{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main>
<h1>TrenchDesk v3<small>週足・日足トレンド＋15分足EMA50押し目</small></h1>
<div id="err"></div>
<div class="top">
  <div class="stat"><span>総資産</span><b class="num" id="eq">–</b><span id="eqsub" class="num"></span></div>
  <div class="stat"><span>今日の損益</span><b class="num" id="day">–</b><span id="daysub"></span></div>
  <div class="stat"><span>保有</span><b class="num" id="pos">–</b><span id="possub"></span></div>
  <div class="stat"><span>サーバー</span><b id="srv">–</b><span id="srvsub"></span></div>
</div>
<div class="bar">
  <button id="bRun">新規エントリーを停止</button>
  <button id="bSrv">サーバー常駐を開始</button>
  <button id="bCopy">報告をコピー</button>
  <button id="bClose" class="warn">全ポジションを決済</button>
</div>
<details id="conn"><summary>接続設定</summary>
  <label>リレーURL<input id="inUrl" autocapitalize="off" spellcheck="false" placeholder="https://floral-hall-1e2f.○○.workers.dev"></label>
  <label>ACCESS_TOKEN<input id="inTok" type="password" autocapitalize="off" spellcheck="false"></label>
  <label>1日の損失上限（$）：超えたら新規エントリーを止める<input id="inStop" type="number" min="1"></label>
  <div class="bar"><button id="bSave">保存</button></div>
</details>
<div id="legacy"></div>
<nav class="tabs" id="tabs"></nav>
<section id="view"></section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const LS = {get:k => { try{ return localStorage.getItem(k) || ""; }catch(_){ return ""; } }, set:(k,v) => { try{ localStorage.setItem(k,v); }catch(_){} }};
  let URL_ = LS.get("trenchdesk_relay_url"), TOK = LS.get("trenchdesk_relay_token"), st = null, srv = null, err = null, tab = "an";
  async function api(path, body){
    if (!URL_ || !TOK) throw new Error("接続設定でリレーURLとACCESS_TOKENを入力してください");
    const r = await fetch(URL_.replace(/\/$/,"") + path, {method: body ? "POST" : "GET", headers: Object.assign({authorization:"Bearer "+TOK}, body ? {"content-type":"application/json"} : {}), body: body ? JSON.stringify(body) : undefined});
    const j = await r.json().catch(() => ({})); if (!r.ok || j.error) throw new Error(j.error || ("HTTP "+r.status)); return j;
  }
  async function pull(){ try{ const j = await api("/server/state"); st = j.state; srv = j.server; err = null; }catch(e){ err = e.message; } render(); }
  async function cmd(b){ try{ const j = await api("/server/cmd", b); st = j.state; srv = j.server; err = null; }catch(e){ err = e.message; } render(); }
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const usd = (v, s) => v == null ? "–" : (s ? (v >= 0 ? "+" : "−") : (v < 0 ? "−" : "")) + "$" + Math.abs(v).toFixed(2);
  const pc = (v, d=2) => v == null ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d) + "%";
  const px = x => x == null ? "–" : x >= 1000 ? x.toFixed(1) : x >= 1 ? x.toFixed(4) : x.toPrecision(4);
  const b = s => String(s).replace(/-?USDT$/, "");
  const DIR = d => d > 0 ? "ロング" : d < 0 ? "ショート" : "–";
  const tm = t => { const d = new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
  const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  const TABS = [["an","分析"],["pos","保有"],["hist","履歴"],["bt","過去検証"],["rule","ルール"],["log","ログ"]];
  const varLabel = r => "逆行判定 "+(r.acc === "S" ? "安値更新" : "ATR"+r.acc+"本")+"／トレーリング "+(r.trail === "h1" ? "1時間足" : "15分足")+"EMA20 余裕"+r.buf+"ATR";

  // ---- 分析：指定の6項目 ----
  function sixItems(a){
    const tr = t => t === "上昇" ? "L-t" : t === "下降" ? "S-t" : "";
    const state = a.held ? "保有中" : a.can ? "待機（反転足が確定すれば可）" : "不可";
    const plan = a.plan ? "方向 "+DIR(a.plan.dir)+"／推奨エントリー 反転足の次の15分足の始値（現在 "+px(a.plan.entry)+"）／損切り "+px(a.plan.stop)+"（"+(a.plan.dir > 0 ? "−" : "+")+st.rule.slPct+"%＝総資産の約2%）／初期トレーリングライン 15分足EMA20 "+px(a.plan.trail)+"（終値が一度"+(a.plan.dir > 0 ? "上" : "下")+"で確定してから有効）／半分利確 "+(a.plan.target != null ? px(a.plan.target)+"（"+a.plan.targetName+"）" : "RR1:1以上離れた節目なし")
      : a.held ? "保有タブを参照" : "条件を満たしていないため、なし";
    return '<div class="card '+(a.held ? (a.dir > 0 ? "L" : "S") : a.watching ? "W" : "")+'"><h3>'+esc(b(a.sym))+' <em class="num">'+px(a.px)+'</em></h3><ol class="six">'+
      '<li><span>週足トレンド：</span><b class="'+tr(a.w)+'">'+a.w+'</b></li>'+
      '<li><span>日足トレンド：</span><b class="'+tr(a.d)+'">'+a.d+'</b></li>'+
      '<li><span>15分足：</span>EMA50 '+px(a.e50)+'（現在値との差 '+pc(a.dist)+'）／直近の足 '+esc(a.shape)+'</li>'+
      '<li><span>エントリー可否：</span><b class="'+(a.can ? "W-t" : "")+'">'+state+'</b>。'+esc(a.reason)+'</li>'+
      '<li><span>具体的内容：</span>'+esc(plan)+'</li>'+
      '<li><span>相関リスク：</span>'+esc(a.corr)+'</li></ol></div>';
  }
  function vAnalysis(){
    const u = st.universe, list = st.analysis || [];
    const h = '<p class="sub">対象 '+u.total+'銘柄（売買代金$5M以上）：週足・日足とも上昇 '+u.up+'／とも下降 '+u.dn+'／不一致・レンジ '+u.range+'／上場1年未満で対象外 '+u.young+(u.noData ? '／データ取得中 '+u.noData : '')+'。上位足が一致した銘柄だけを、EMA50に近い順に表示します。</p>';
    return h + (list.length ? list.map(sixItems).join("") : '<div class="empty">週足と日足のトレンドが一致している銘柄はまだありません。データ取得中の場合は数分待ってください。</div>');
  }
  function vPositions(){
    const ps = st.positions; if (!ps.length) return '<div class="empty">保有中のポジションはありません。</div>';
    return ps.map(p => '<div class="card '+(p.dir > 0 ? "L" : "S")+'"><h3>'+esc(b(p.sym))+' '+DIR(p.dir)+'（'+esc(p.pat)+'）<em class="num">'+usd(p.upnl,1)+'（総資産の'+pc(p.upnlEq)+'）</em></h3><ol class="six" style="list-style:none;padding:0">'+
      '<li><span>建値 </span>'+px(p.entry)+(p.fillEntry ? '（実約定）' : '（想定）')+'<span>／現在 </span>'+px(p.px)+'<span>／証拠金 </span>'+usd(p.margin)+'</li>'+
      '<li><span>損切り </span>'+px(p.stop)+(p.be ? '（半分利確後、建値＋手数料分へ引き上げ済み）' : '（取引所にも注文済み）')+'</li>'+
      '<li><span>トレーリング </span>15分足EMA20 '+px(p.e20)+'：'+(p.armed ? "有効（終値が抜けたら決済）" : "まだ無効（終値がEMA20の"+(p.dir > 0 ? "上" : "下")+"で確定したら有効）")+'</li>'+
      '<li><span>半分利確 </span>'+(p.target != null ? px(p.target)+'（'+esc(p.targetName)+'）'+(p.half ? "：実行済み" : "") : "目標なし")+'</li>'+
      '<li><span>取引所 </span>'+esc(p.live ? ({open:"発注済み", opening:"発注中", error:"失敗", skip:"見送り", closed:"決済済み"}[p.live.status]||p.live.status)+(p.live.msg ? "（"+p.live.msg+"）" : "") : "–")+'<span>／開始 </span>'+tm(p.ts)+'</li></ol></div>').join("");
  }
  function vHistory(){
    const s = st.stats, tr = st.trades;
    const f = st.fills, fs = (v, n) => n ? (v >= 0 ? "+" : "−")+Math.abs(v).toFixed(2)+"%（"+n+"件）" : "まだ取得なし";
    const h = '<p class="sub num">決済 '+s.n+'件／勝率 '+(s.win == null ? "–" : s.win+"%")+'／合計 '+usd(s.net,1)+'</p>'+
      '<p class="sub">損益は、取引所の実際の約定価格で計算します（取得できなかったものは「推定」。ティッカー価格と手数料0.05%×2で見積もり）。想定価格との差（不利側が＋）：入り '+(f ? fs(f.en, f.enN) : "まだ取得なし")+'／出 '+(f ? fs(f.ex, f.exN) : "まだ取得なし")+'。バックテストが想定している差は、往復で0.1%です。</p>';
    if (!tr.length) return h + '<div class="empty">まだ決済された取引はありません。</div>';
    return h + '<div class="scroll"><table class="num"><tr><th>銘柄</th><th>方向</th><th>決済</th><th>損益</th><th>総資産比</th><th>理由</th></tr>'+
      tr.map(t => '<tr><td>'+esc(b(t.sym))+'</td><td class="'+(t.dir > 0 ? "L-t" : "S-t")+'">'+DIR(t.dir)+'</td><td>'+tm(t.exitTs)+'</td><td>'+usd(t.net,1)+'</td><td>'+pc(t.eqPct)+'</td><td style="text-align:left">'+esc(t.reason)+(t.est ? "（推定）" : "")+'</td></tr>').join("")+'</table></div>';
  }
  function vBacktest(){
    const t = st.bt; if (!t) return '<div class="empty">データ待ち</div>';
    let h = '<p class="sub">過去約60日の15分足で、この戦略を上位60銘柄に当てはめた結果です。'+(t.complete ? "完了" : "取得中 "+t.done+"/"+t.total+"銘柄（1銘柄あたり約20秒）")+(t.skipped ? "・データ不足で除外 "+t.skipped : "")+(t.days ? "・期間 "+t.days+"日" : "")+'。★が実売買と同じ設定です。</p>';
    h += '<p class="sub">年率は複利（毎回その時点の総資産の10%で入る）で、最大5件・同じ方向3件・BTCとETHのルールを守って採用した取引だけで計算します。1回平均は値動きの%（手数料・スリッページ込み）。「ランダム比」は同じトレンド条件で8時間おきに入った場合との差です。✅＝年率15%以上・前半後半とも年率プラス・ランダムより良い。60日は短く、1〜2回の大きな相場で結果が変わります。</p>';
    h += '<div class="scroll"><table class="num"><tr><th>設定</th><th>件数</th><th>勝率</th><th>1回平均</th><th>ランダム比</th><th>年率</th><th>前半/後半</th><th>最大DD</th><th></th></tr>';
    for (const r of t.rows){
      if (!r.n){ h += '<tr><td>'+esc(r.k)+'</td><td colspan="8">データなし</td></tr>'; continue; }
      h += '<tr class="'+(r.live ? "live" : "")+'"><td>'+(r.live ? "★ " : "")+esc(varLabel(r))+'</td><td>'+r.pf.n+'/'+r.n+'</td><td>'+r.win+'%</td><td>'+pc(r.avg)+'±'+r.ci.toFixed(2)+'</td><td>'+pc(r.diff)+'</td><td>'+pc(r.pf.ann,0)+'</td><td>'+pc(r.pf.annA,0)+'/'+pc(r.pf.annB,0)+'</td><td>'+pc(r.pf.dd,1)+'</td><td>'+(r.ok ? "✅" : "")+'</td></tr>';
    }
    return h + '</table></div><div class="bar"><button id="bBt" class="warn">過去検証をやり直す</button></div>';
  }
  function vRules(){
    const R = st.rule, row = (k,v) => '<dt>'+k+'</dt><dd>'+v+'</dd>';
    return '<div class="card"><dl class="rules">'+
      row("レバレッジ", R.lev+"倍固定")+row("1回のサイズ", "証拠金＝総資産の"+(R.marginPct*100)+"%（建玉は総資産の"+(R.marginPct*R.lev*100)+"%）")+
      row("同時保有", "最大"+R.maxPos+"件（証拠金は最大50%、現金は常に50%以上）")+row("同じ方向", "最大"+R.maxSameDir+"件")+row("BTCとETH", "同時に同じ方向では持たない")+
      row("対象銘柄", "24時間売買代金$5M以上・上場1年以上（週足"+R.minWeeks+"本以上）")+
      row("トレンド", "週足と日足で、EMA20＞EMA50かつ終値＞EMA50＝上昇、逆＝下降。両方一致した方向だけ")+
      row("EMA50接触", "15分足の安値がEMA50以下（ショートは高値が以上）。直前の足の終値はEMA50のトレンド側")+
      row("反転足", "包み足：前の足と逆向きの足で、実体が前の実体を完全に包む。はらみ足：実体が前の実体の内側")+
      row("待つ時間", "接触した足の後、"+R.watchBars+"本（2時間）以内に反転足が確定したら、次の足で入る")+
      row("逆行の加速", "15分足の終値がEMA50からATR(14)の"+R.accK+"本分以上逆側：エントリー前は取り消し、後は損切り")+
      row("損切り", "建値から"+R.slPct+"%（手数料・スリッページ込みで総資産の約2.0%）。取引所にも注文を置く")+
      row("トレーリング", "終値が15分足EMA20から、ATRの"+R.trailBuf+"本分以上逆側で確定したら全決済。有効になるのは、終値がEMA20から同じ幅だけ順行側で確定してから（余裕を持たせて、小さな往復で決済されにくくしてある）")+
      row("半分利確", "日足EMA20・EMA50・20日高値（ショートは安値）のうち、損切り幅以上離れていて一番近いものに到達したら半分。その後、残りの損切りを建値＋"+(R.beCost*100).toFixed(1)+"%（手数料分）へ引き上げ")+
      row("1日の上限", "当日の損失が$"+(srv ? srv.dailyStop : "–")+"を超えたら新規エントリーを停止")+
      '</dl></div>';
  }
  function vLog(){ return '<div class="log">'+st.log.map(l => '<div><i>'+tm(l.t)+'</i><b>'+esc(l.tag)+'</b> '+esc(l.msg)+'</div>').join("")+'</div>'; }

  function report(){
    if (!st) return "データがありません";
    const L = ["=== TrenchDesk v3（"+new Date().toLocaleString("ja-JP")+"）===", "総資産 "+usd(st.equity)+"／開始 $"+st.startUsd+"／決済 "+st.stats.n+"件・勝率 "+(st.stats.win==null?"–":st.stats.win+"%")+"・合計 "+usd(st.stats.net,1), ""];
    if (st.legacy){ L.push("--- 管理外（以前のルールの残りなど） ---"); (st.legacy.positions||[]).forEach(x => L.push(x.sym+" "+(x.side==="LONG"?"ロング":"ショート")+" 数量 "+x.amt+" 建値 "+px(x.entry)+" 含み "+usd(x.pnl,1))); if ((st.legacy.orderSyms||[]).length) L.push("注文のみ："+st.legacy.orderSyms.join("、")); L.push(""); }
    if (st.fills) L.push("約定のずれ（不利側が＋）：入り "+(st.fills.en==null?"–":st.fills.en.toFixed(2)+"%（"+st.fills.enN+"件）")+"／出 "+(st.fills.ex==null?"–":st.fills.ex.toFixed(2)+"%（"+st.fills.exN+"件）")+"　※バックテストの想定は往復0.1%");
    L.push("--- 保有 ---"); st.positions.forEach(p => L.push(b(p.sym)+" "+DIR(p.dir)+"（"+p.pat+"）建値 "+px(p.entry)+" 現在 "+px(p.px)+" 含み "+usd(p.upnl,1)+" 損切り "+px(p.stop)+(p.be?"（建値へ引き上げ済み）":"")+" トレーリング "+(p.armed?"有効":"未")+" 半分利確 "+(p.target!=null?px(p.target)+(p.half?"済":""):"なし"))); L.push("");
    L.push("--- 過去検証 ---"); const t = st.bt; if (t){ L.push((t.complete?"完了":"取得中 "+t.done+"/"+t.total)+" 期間 "+t.days+"日"); t.rows.forEach(r => L.push((r.live?"★ ":"")+varLabel(r)+"："+(r.n ? "採用 "+r.pf.n+"/"+r.n+"件・勝率 "+r.win+"%・1回平均 "+pc(r.avg)+"±"+r.ci.toFixed(2)+"・ランダム比 "+pc(r.diff)+"・年率 "+pc(r.pf.ann,0)+"（前半 "+pc(r.pf.annA,0)+"／後半 "+pc(r.pf.annB,0)+"）・最大DD "+pc(r.pf.dd,1)+"・決済内訳 損切り"+r.exits.sl+"/トレーリング"+r.exits.tr+"/逆行加速"+r.exits.ac+"・包み足"+r.pats.en+"/はらみ足"+r.pats.ha+(r.ok?" ✅":"") : "データなし"))); } L.push("");
    L.push("--- 決済履歴 ---"); st.trades.slice(0,50).forEach(x => L.push(tm(x.exitTs)+" "+b(x.sym)+" "+DIR(x.dir)+" "+usd(x.net,1)+"（"+pc(x.eqPct)+"）"+x.reason+(x.est?"（推定）":""))); L.push("");
    L.push("--- 分析（上位） ---"); (st.analysis||[]).slice(0,15).forEach(a => L.push(b(a.sym)+"：週足"+a.w+"・日足"+a.d+"・EMA50との差 "+pc(a.dist)+"・"+a.shape+"・"+a.reason));
    L.push(""); L.push("--- ログ ---"); st.log.slice(0,40).forEach(l => L.push(tm(l.t)+" "+l.tag+" "+l.msg));
    return L.join("\n");
  }

  function vLegacy(){
    const L = st.legacy; if (!L) return "";
    const ps = L.positions || [], os = L.orderSyms || [];
    return '<div class="card W"><h3>このアプリが管理していないポジション・注文があります</h3><p class="sub">以前のルールで建てたものなどです。自動では決済しません。このアプリはこれらの損切りを動かさないため、取引所に残っている注文だけが守りになります。確認のうえ、必要ならボタンで決済してください（その銘柄の未約定注文も取り消します）。この銘柄は、片付くまで新規エントリーしません。</p>'+
      (ps.length ? '<div class="scroll"><table class="num"><tr><th>銘柄</th><th>方向</th><th>数量</th><th>建値</th><th>含み損益</th></tr>'+ps.map(x => '<tr><td>'+esc(x.sym)+'</td><td class="'+(x.side === "LONG" ? "L-t" : "S-t")+'">'+(x.side === "LONG" ? "ロング" : "ショート")+'</td><td>'+x.amt+'</td><td>'+px(x.entry)+'</td><td>'+usd(x.pnl,1)+'</td></tr>').join("")+'</table></div>' : '')+
      (os.length ? '<p class="sub">ポジションのない銘柄に残っている未約定注文：'+esc(os.join("、"))+'</p>' : '')+
      '<p class="sub">確認 '+tm(L.at)+'</p><div class="bar"><button id="bLgScan">再確認</button><button id="bLgClose" class="warn">これらを決済・注文を取り消す</button></div></div>';
  }
  function render(){
    $("legacy").innerHTML = st ? vLegacy() : "";
    { const a = $("bLgScan"), c = $("bLgClose");
      if (a) a.onclick = () => cmd({cmd:"legacyScan"});
      if (c) c.onclick = () => { if (confirm("管理外のポジションを成行で決済し、その銘柄の未約定注文を取り消しますか？")) cmd({cmd:"legacyClose"}); }; }
    $("err").innerHTML = err ? '<div class="err">'+esc(err)+'</div>' : (st && st.lastErr ? '<div class="err">直近のエラー：'+esc(st.lastErr)+'</div>' : "");
    $("tabs").innerHTML = TABS.map(([k,l]) => '<button data-t="'+k+'" class="'+(k === tab ? "on" : "")+'">'+l+(k === "pos" && st ? "（"+st.positions.length+"）" : "")+'</button>').join("");
    if (!st){ $("view").innerHTML = '<div class="empty">'+(URL_ ? "サーバーからの応答を待っています。" : "最初に「接続設定」を開いて、リレーURLとACCESS_TOKENを保存してください。")+'</div>'; if (!URL_) $("conn").open = true; return; }
    const dayPnl = (st.day && st.day[today()]) || 0, lag = srv && srv.lastTickAt ? Math.round((Date.now() - srv.lastTickAt)/1000) : null;
    $("eq").textContent = usd(st.equity); $("eqsub").textContent = "開始 $"+st.startUsd+"（"+pc((st.equity/st.startUsd - 1)*100)+"）";
    $("day").textContent = usd(dayPnl, 1); $("daysub").textContent = srv && srv.stoppedDay === today() ? "上限到達で新規停止中" : "上限 $"+(srv ? srv.dailyStop : "–");
    $("pos").textContent = st.positions.length+"/"+st.rule.maxPos; $("possub").textContent = "ロング"+st.positions.filter(p=>p.dir>0).length+"・ショート"+st.positions.filter(p=>p.dir<0).length+"／新規"+(st.running ? "受付中" : "停止中");
    $("srv").textContent = srv && srv.enabled ? "常駐中" : "停止中"; $("srvsub").textContent = lag == null ? "" : "最終処理 "+lag+"秒前";
    $("bRun").textContent = st.running ? "新規エントリーを停止" : "新規エントリーを再開";
    $("bSrv").textContent = srv && srv.enabled ? "サーバー常駐を停止" : "サーバー常駐を開始";
    const V = {an:vAnalysis, pos:vPositions, hist:vHistory, bt:vBacktest, rule:vRules, log:vLog}[tab];
    const y = window.scrollY; $("view").innerHTML = V(); window.scrollTo(0, y);
    const bb = $("bBt"); if (bb) bb.onclick = () => { if (confirm("過去検証の結果を消して、最初からやり直しますか？（約20分かかります）")) cmd({cmd:"btRestart"}); };
  }
  $("tabs").onclick = e => { const t = e.target.closest("button"); if (t){ tab = t.dataset.t; render(); } };
  $("bRun").onclick = () => cmd({cmd: st && st.running ? "pause" : "resume"});
  $("bSrv").onclick = () => cmd({cmd: srv && srv.enabled ? "srvOff" : "srvOn"});
  $("bClose").onclick = () => { if (confirm("保有中のポジションをすべて成行で決済しますか？")) cmd({cmd:"closeAll"}); };
  $("bCopy").onclick = async () => { const t = report(); try{ await navigator.clipboard.writeText(t); $("bCopy").textContent = "コピーしました"; }catch(_){ prompt("コピーしてください", t); } setTimeout(() => $("bCopy").textContent = "報告をコピー", 1500); };
  $("inUrl").value = URL_; $("inTok").value = TOK;
  $("bSave").onclick = () => { URL_ = $("inUrl").value.trim(); TOK = $("inTok").value.trim(); LS.set("trenchdesk_relay_url", URL_); LS.set("trenchdesk_relay_token", TOK);
    const ds = +$("inStop").value; if (ds > 0) cmd({cmd:"srvCfg", dailyStop:ds}); $("conn").open = false; pull(); };
  pull(); setInterval(pull, 3000);
})();
</script>
</body>
